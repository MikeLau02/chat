# Configuración para Render (render.com): New > Blueprint y elegir este repositorio.
services:
  - type: web
    name: chatbot-vision-mundial
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GRAPH_API_VERSION
        value: v23.0
      - key: PANEL_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
